name: dl2_gpu
channels:
  - conda-forge
  - nvidia
  - defaults

dependencies:
  - python=3.11
  - pip
  - jax=0.4.26
  - jaxlib=0.4.26=*cuda*
  - flax=0.8.4
  - optax=0.2.2
  - chex=0.1.86
  - matplotlib=3.9.0
  - seaborn=0.13.2
  - tqdm=4.66.4
  - scikit-learn=1.4.2
  - networkx=3.2.1
  - hydra-core=1.3.2
  - omegaconf=2.3.0
  - pip:
      - wandb==0.17.3
      - huggingface_hub==0.24.6
      - torch==2.4.1+cu118
      - torchvision==0.17.1+cu118
      - torchaudio==2.2.1+cu118
      - --extra-index-url https://download.pytorch.org/whl/cu118
