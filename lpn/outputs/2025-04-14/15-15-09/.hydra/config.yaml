training:
  seed: 0
  resume_from_checkpoint: null
  inference_mode: mean
  inference_kwargs:
    num_steps: 1
    lr: 0.1
    optimizer: adam
    optimizer_kwargs:
      b2: 0.9
  batch_size: 128
  gradient_accumulation_steps: 2
  total_num_steps: 500000
  log_every_n_steps: 100
  eval_every_n_logs: 100
  save_checkpoint_every_n_logs: 100
  learning_rate: 0.0004
  prior_kl_coeff: 0.0001
  pairwise_kl_coeff: null
  mixed_precision: true
  online_data_augmentation: true
  task_generator:
    num_workers: 16
    num_pairs: 4
    class: ARC
  train_datasets: null
eval:
  eval_datasets: null
  test_datasets:
  - generator: ARC
    task_generator_kwargs: null
    name: generator_mean
    num_pairs: 4
    length: 48
    batch_size: 16
    num_tasks_to_show: 48
  - generator: ARC
    task_generator_kwargs: null
    name: generator_gradient_ascent_1
    num_pairs: 4
    length: 48
    batch_size: 16
    num_tasks_to_show: 48
    inference_mode: gradient_ascent
    inference_kwargs:
      num_steps: 1
      lr: 0.1
      optimizer: adam
      optimizer_kwargs:
        b2: 0.9
  - generator: ARC
    task_generator_kwargs: null
    name: generator_gradient_ascent_20
    num_pairs: 4
    length: 48
    batch_size: 16
    num_tasks_to_show: 48
    inference_mode: gradient_ascent
    inference_kwargs:
      num_steps: 20
      lr: 0.1
      optimizer: adam
      optimizer_kwargs:
        b2: 0.9
  json_datasets:
  - challenges: json/arc-agi_training_challenges.json
    solutions: json/arc-agi_training_solutions.json
    name: mean
    only_n_tasks: 100
    num_tasks_to_show: 50
  - challenges: json/arc-agi_training_challenges.json
    solutions: json/arc-agi_training_solutions.json
    name: gradient_ascent_20
    only_n_tasks: 100
    num_tasks_to_show: 50
    inference_mode: gradient_ascent
    inference_kwargs:
      num_steps: 20
      lr: 0.1
      optimizer: adam
      optimizer_kwargs:
        b2: 0.9
  - challenges: json/arc-agi_evaluation_challenges.json
    solutions: json/arc-agi_evaluation_solutions.json
    name: mean
    only_n_tasks: 100
    num_tasks_to_show: 50
  - challenges: json/arc-agi_evaluation_challenges.json
    solutions: json/arc-agi_evaluation_solutions.json
    name: gradient_ascent_20
    only_n_tasks: 100
    num_tasks_to_show: 50
    inference_mode: gradient_ascent
    inference_kwargs:
      num_steps: 20
      lr: 0.1
      optimizer: adam
      optimizer_kwargs:
        b2: 0.9
encoder_transformer:
  _target_: src.models.utils.EncoderTransformerConfig
  max_rows: 30
  max_cols: 30
  num_layers: 4
  transformer_layer:
    _target_: src.models.utils.TransformerLayerConfig
    num_heads: 8
    emb_dim_per_head: 32
    mlp_dim_factor: 4.0
    dropout_rate: 0.0
    attention_dropout_rate: 0.0
  latent_dim: 128
  variational: true
  latent_projection_bias: false
decoder_transformer:
  _target_: src.models.utils.DecoderTransformerConfig
  max_rows: 30
  max_cols: 30
  num_layers: 4
  transformer_layer:
    _target_: src.models.utils.TransformerLayerConfig
    num_heads: 8
    emb_dim_per_head: 32
    mlp_dim_factor: 4.0
    dropout_rate: 0.0
    attention_dropout_rate: 0.0
